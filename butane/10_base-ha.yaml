variant: flatcar
version: 1.1.0
ignition:
  config:
    merge:
      - local: ign/00_base-k8s.ign
      - local: ign/00_base-k8s-token.ign
passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFWQDU76xmrS05SQ9tnHk9uX5gmDyzjBRGW+O3kSKQdm tyler@cachyos-x8664
storage:
  files:
    # Cluster-wide settings shared by every node. The @...@ values are filled
    # in from cluster.env by scripts/render-butane.sh. K8S_VERSION must match the
    # kubernetes sysext in 00_base-k8s.yaml. CILIUM_VERSION is only the day-0
    # install; Flux owns Cilium after that (k8s/infrastructure/controllers/cilium).
    - path: /etc/kubernetes/kubeadm-env.conf
      mode: 0644
      contents:
        inline: |
          K8S_VERSION=v1.37.1
          K8S_APISERVER_URL=@API_VIP@
          K8S_APISERVER_PORT=6444
          K8S_POD_CIDR=@POD_CIDR@
          K8S_SERVICE_CIDR=@SERVICE_CIDR@
          CRI_SOCKET=unix:///var/run/crio/crio.sock
          CILIUM_VERSION=1.20.2
