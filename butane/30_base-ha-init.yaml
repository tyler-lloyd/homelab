variant: flatcar
version: 1.1.0
ignition:
  config:
    merge:
      - local: ign/20_base-ha-cp.ign
storage:
  files:
    # Shared with the Flux HelmRelease that takes Cilium over once Flux is running
    - path: /etc/cilium/values.yaml
      mode: 0644
      contents:
        local: k8s/infrastructure/controllers/cilium/values.yaml
systemd:
  units:
    - name: kubeadm.service
      enabled: true
      contents: |
        [Unit]
        Description=kubeadm init (first control plane node)
        Wants=network-online.target
        After=network-online.target crio.service keepalived.service haproxy.service
        Requires=crio.service
        ConditionPathExists=!/etc/kubernetes/kubelet.conf

        [Service]
        Type=oneshot
        RemainAfterExit=true
        TimeoutStartSec=infinity
        EnvironmentFile=/etc/kubernetes/kubeadm-env.conf
        EnvironmentFile=/etc/kubernetes/certs.conf
        EnvironmentFile=/etc/kubernetes/node-env.conf
        # The CAs are pre-provisioned on every control plane node, so no
        # --upload-certs/--certificate-key is needed (and nothing expires after 2h).
        # --token-ttl 0 lets nodes be rebuilt and rejoin later with the same Ignition.
        # kube-proxy is skipped because Cilium replaces it.
        ExecStart=/usr/bin/kubeadm init \
          --kubernetes-version ${K8S_VERSION} \
          --token ${K8S_TOKEN} --token-ttl 0 \
          --cri-socket ${CRI_SOCKET} \
          --control-plane-endpoint ${K8S_APISERVER_URL}:${K8S_APISERVER_PORT} \
          --apiserver-advertise-address ${NODE_IP} \
          --pod-network-cidr ${K8S_POD_CIDR} \
          --service-cidr ${K8S_SERVICE_CIDR} \
          --skip-phases addon/kube-proxy
        ExecStartPost=/usr/bin/install -d -o core -g core /home/core/.kube
        ExecStartPost=/usr/bin/install -o core -g core -m 0600 /etc/kubernetes/admin.conf /home/core/.kube/config

        [Install]
        WantedBy=multi-user.target
    - name: cilium-install.service
      enabled: true
      contents: |
        [Unit]
        Description=Install Cilium as the Kubernetes CNI
        Requires=kubeadm.service cilium-cli-setup.service
        After=kubeadm.service cilium-cli-setup.service
        ConditionPathExists=!/var/lib/cilium-installed

        [Service]
        Type=oneshot
        RemainAfterExit=true
        TimeoutStartSec=infinity
        Restart=on-failure
        RestartSec=30
        Environment=KUBECONFIG=/etc/kubernetes/admin.conf
        # The cilium CLI refuses to run without a cache directory
        Environment=HOME=/root
        EnvironmentFile=/etc/kubernetes/kubeadm-env.conf
        # values.yaml leaves out the API VIP, as the HelmRelease does
        ExecStart=/opt/bin/cilium install \
          --version ${CILIUM_VERSION} \
          --values /etc/cilium/values.yaml \
          --set k8sServiceHost=${K8S_APISERVER_URL}
        ExecStartPost=/usr/bin/touch /var/lib/cilium-installed

        [Install]
        WantedBy=multi-user.target
