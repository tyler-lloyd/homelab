apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Apps need storage, LoadBalancer IPs, etc. from the infrastructure layers
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: ./k8s/apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # ${NAME} in a manifest becomes the value from cluster.env
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
