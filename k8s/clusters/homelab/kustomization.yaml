apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything in this directory has to be listed: with this file here, Flux no
# longer picks up new manifests on its own.
resources:
  - flux-system
  - infrastructure.yaml
  - apps.yaml
# cluster.env as a ConfigMap, for the Kustomizations above to substitute into
# what they apply: ${API_VIP} in a manifest becomes the value from that file.
configMapGenerator:
  - name: cluster-vars
    namespace: flux-system
    envs:
      - cluster.env
generatorOptions:
  disableNameSuffixHash: true
