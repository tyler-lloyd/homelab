apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - helmrepository.yaml
  - helmrelease.yaml
# values.yaml is also baked into k8s-cp1's Ignition for the day-0 install, so
# it stays a plain Helm values file. The hashed name makes a values change
# roll out as a HelmRelease change.
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
