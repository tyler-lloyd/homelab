# Cilium Helm values, used both by the day-0 install on k8s-cp1
# (cilium-install.service, see butane/30_base-ha-init.yaml) and by the Flux
# HelmRelease that manages Cilium afterwards. Everything the cilium CLI would
# otherwise auto-detect is pinned here, so both always render the same thing.
kubeProxyReplacement: true
# The API server as Cilium reaches it: HAProxy on the API VIP. The host is not
# set here because it comes from cluster.env: the HelmRelease and
# cilium-install.service each pass k8sServiceHost themselves. The port must
# match K8S_APISERVER_PORT in butane/10_base-ha.yaml.
k8sServicePort: 6444
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
cluster:
  name: kubernetes
operator:
  replicas: 1
  rollOutPods: true
# Without these, a config change updates the ConfigMap but the running agents
# and operator never pick it up, while the HelmRelease still reports success.
rollOutCiliumPods: true
# Answer ARP for LoadBalancer IPs (pools and announcement policy live in
# infrastructure/configs/cilium). The default client rate limit (10 QPS)
# covers ~50 announced services at the default 5s lease renewal.
l2announcements:
  enabled: true
# Let other CNI plugins chain themselves into Cilium's CNI config. With the
# default (true), Cilium owns /etc/cni/net.d: it regenerates
# 05-cilium.conflist on any activity in that directory, which reverts
# whatever a chained plugin adds to it.
cni:
  exclusive: false
