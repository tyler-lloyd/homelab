# Workers answer ARP for every LoadBalancer IP; one node (elected via a lease)
# holds each IP. L2 announcements ignore where a service's pods run, so
# services must keep externalTrafficPolicy: Cluster: with Local, the holder
# may have no pod and drop the traffic.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
  annotations:
    # Nothing here comes from cluster.env, and the $ below must reach Cilium
    # as written
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^eth0$
  loadBalancerIPs: true
