# LoadBalancer Service IPs on the LAN; the range is set in cluster.env. Pin
# one with the annotation lbipam.cilium.io/ips; otherwise the next free one is
# used. Keep this range out of the router's DHCP pool.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
    - start: "${LB_RANGE_START}"
      stop: "${LB_RANGE_STOP}"
