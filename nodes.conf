# The cluster's nodes: what each one is and where it runs. The LAN they share
# is described in k8s/clusters/homelab/cluster.env.
#
# role:   control-plane or worker. The first control-plane node listed runs
#         kubeadm init; the others join one at a time, in this order.
# gpu:    PCI address of a GPU to pass through (all its functions), or - for none.
#         The device must be bound to vfio-pci on the Proxmox host (see docs/gpu.md).
# labels: extra node labels for the kubelet, comma-separated, or - for none.
#         Proxmox CSI needs the topology labels (see docs/storage.md).
#
# name        role           vmid  pve_host      ip            cores  memory_mb  disk  gpu         labels
k8s-cp1       control-plane  121   192.168.1.10  192.168.1.21  2      4096       32G   -           -
k8s-cp2       control-plane  122   192.168.1.10  192.168.1.22  2      4096       32G   -           -
k8s-cp3       control-plane  123   192.168.1.10  192.168.1.23  2      4096       32G   -           -
k8s-worker1   worker         124   192.168.1.11  192.168.1.24  16     32768      200G  0000:0a:00  topology.kubernetes.io/region=pve,topology.kubernetes.io/zone=pve
